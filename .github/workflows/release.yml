name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Build release archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read integration metadata
        id: metadata
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/homekit_child_bridge/manifest.json"))["version"])')"
          if [[ "v${version}" != "${{ github.event.release.tag_name }}" ]]; then
            echo "Release tag must be v${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build integration archive
        shell: bash
        run: |
          cd custom_components/homekit_child_bridge
          zip -r "../../homekit_child_bridge.zip" .

      - name: Upload release archive
        uses: softprops/action-gh-release@v2
        with:
          files: homekit_child_bridge.zip
