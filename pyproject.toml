[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homekit-child-bridge"
version = "0.3.2"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
